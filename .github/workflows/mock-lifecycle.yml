name: Verify Mock lifecycle

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_dispatch:
    inputs:
      cloudflare_live_checks:
        description: Run public Cloudflare index/APK and GitHub fallback verification (no install)
        required: false
        default: false
        type: boolean
      download_progress_checks:
        description: Run Mock download presentation routing checks
        required: false
        default: false
        type: boolean
      sleep_checks:
        description: Run isolated sleep UI and reconnect checks
        required: false
        default: false
        type: boolean
      preheat_checks:
        description: Run isolated studio preheat and UI evidence only
        required: false
        default: false
        type: boolean
      update_checks:
        description: 'Run fixed isolated update runtime and UI acceptance instead of lifecycle'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_LIVE_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_live_checks == true && 'true' || 'false' }}
      DOWNLOAD_PROGRESS_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.download_progress_checks == true && 'true' || 'false' }}
      SLEEP_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.sleep_checks == true && 'true' || 'false' }}
      PREHEAT_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.preheat_checks == true && 'true' || 'false' }}
      UPDATE_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_checks == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock APK
        if: env.UPDATE_CHECKS != 'true'
        run: ./gradlew :mobile:assembleMock :mobile:assembleMockAndroidTest --no-daemon --console=plain
      - name: Build fixed isolated update acceptance
        if: env.UPDATE_CHECKS == 'true'
        run: |
          ./gradlew --no-daemon --console=plain -PhoyiUpdateChecks=true :mobile:assembleUpdateFixture :mobile:assembleUpdateFixtureAndroidTest
          python3 scripts/check_update_acceptance.py --sdk "$ANDROID_HOME" --verify-only
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify lifecycle with targeted logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check_mock_or_update_acceptance.sh
      - name: Upload lifecycle logs
        if: always() && env.UPDATE_CHECKS != 'true' && env.PREHEAT_CHECKS != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mock-lifecycle
          path: build/mock-lifecycle/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload isolated update acceptance evidence
        if: always() && env.UPDATE_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: update-acceptance-api34
          path: build/update-acceptance/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload studio preheat evidence
        if: always() && env.PREHEAT_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: studio-preheat-${{ github.sha }}
          path: build/studio-preheat/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sleep connection evidence
        if: always() && env.SLEEP_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sleep-connection-${{ github.sha }}
          path: build/sleep-connection/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload download routing evidence
        if: always() && env.DOWNLOAD_PROGRESS_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: download-routing-${{ github.sha }}
          path: build/download-routing/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Cloudflare live evidence
        if: always() && env.CLOUDFLARE_LIVE_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-live-${{ github.sha }}
          path: build/cloudflare-live/
          retention-days: 7
