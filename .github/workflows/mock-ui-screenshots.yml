name: Capture Mock UI

on:
  workflow_dispatch:
    inputs:
      quick_curve_visual:
        description: Capture only populated Home quick curves on phone and tablet, with wallpaper in both themes
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUICK_CURVE_VISUAL: ${{ inputs.quick_curve_visual == true && 'true' || 'false' }}
      QUICK_CURVE_AVD: openhoyi-quick-curve-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock APK
        run: |
          ./gradlew :mobile:assembleMock :mobile:assembleMockAndroidTest --no-daemon --console=plain
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from mock_ui_tap import validate_runner_manifest
          validate_runner_manifest(Path('mobile/build/intermediates/packaged_manifests/mockAndroidTest/processMockAndroidTestManifest/AndroidManifest.xml').read_text())
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture tablet UI and simulated shot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          avd-name: ${{ env.QUICK_CURVE_VISUAL == 'true' && env.QUICK_CURVE_AVD || 'test' }}
          emulator-port: 5554
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            if [ "$QUICK_CURVE_VISUAL" = true ]; then python3 scripts/check_quick_curve_visual.py;
            else bash scripts/capture_mock_ui.sh; fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mock-ui-screenshots
          path: build/mock-ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
