name: Capture Mock UI

on:
  workflow_dispatch:
    inputs:
      quick_curve_visual:
        description: Capture only populated Home quick curves on phone and tablet, with wallpaper and solid backgrounds in both themes
        type: boolean
        required: false
        default: false
      quick_curve_profile:
        description: Choose fresh hosted viewport(s) for quick-curve proof
        type: choice
        required: false
        default: both
        options: [both, phone, phone-short, tablet]

      quick_curve_boiler_view:
        description: Also verify offscreen boiler controls and detached fake GATT (phone emulator only)
        type: boolean
        default: false

      boiler_warmup:
        description: Record both boilers warming in the actual Mock phone Home
        type: boolean
        default: false

      settings_categories:
        description: Capture actual B settings on dark phone and light tablet
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.settings_categories && '["phone","tablet"]' || inputs.boiler_warmup && '["phone"]' || inputs.quick_curve_visual && (inputs.quick_curve_profile == 'tablet' && '["tablet"]' || inputs.quick_curve_profile == 'phone' && '["phone"]' || inputs.quick_curve_profile == 'phone-short' && '["phone-short"]' || '["phone","tablet"]') || '["legacy"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUICK_CURVE_VISUAL: ${{ (inputs.quick_curve_visual == true || inputs.boiler_warmup == true || inputs.settings_categories == true) && 'true' || 'false' }}
      QUICK_CURVE_BOILER_VIEW: ${{ inputs.quick_curve_boiler_view == true && 'true' || 'false' }}
      BOILER_WARMUP: ${{ inputs.boiler_warmup == true && 'true' || 'false' }}
      SETTINGS_CATEGORIES: ${{ inputs.settings_categories == true && 'true' || 'false' }}
      QUICK_CURVE_PROFILE: ${{ matrix.profile }}
      QUICK_CURVE_AVD: openhoyi-quick-curve-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock APK
        run: |
          ./gradlew :mobile:assembleMock :mobile:assembleMockAndroidTest --no-daemon --console=plain
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from mock_ui_tap import validate_runner_manifest
          validate_runner_manifest(Path('mobile/build/intermediates/packaged_manifests/mockAndroidTest/processMockAndroidTestManifest/AndroidManifest.xml').read_text())
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture isolated Mock viewport
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          avd-name: ${{ env.QUICK_CURVE_VISUAL == 'true' && env.QUICK_CURVE_AVD || 'test' }}
          emulator-port: 5554
          target: default
          arch: x86_64
          profile: ${{ matrix.profile == 'tablet' && 'Nexus 10' || 'pixel_7_pro' }}
          ram-size: 2048M
          disable-animations: ${{ !inputs.boiler_warmup }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            if [ "$QUICK_CURVE_VISUAL" = true ]; then python3 scripts/check_quick_curve_visual.py;
            else bash scripts/capture_mock_ui.sh; fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.profile == 'legacy' && 'mock-ui-screenshots' || format('mock-ui-screenshots-{0}', matrix.profile) }}
          path: build/mock-ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
