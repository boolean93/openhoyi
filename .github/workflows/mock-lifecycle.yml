name: Verify Mock lifecycle

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_dispatch:
    inputs:
      ai_card_checks:
        description: Run only existing detached AI card construction checks on a disposable cloud emulator
        required: false
        default: false
        type: boolean
      ai_copy_checks:
        description: Run only AI chat copy gestures on a disposable cloud emulator
        required: false
        default: false
        type: boolean
      cloudflare_live_checks:
        description: Run public Cloudflare index/APK and GitHub fallback verification (no install)
        required: false
        default: false
        type: boolean
      download_progress_checks:
        description: Run Mock download presentation routing checks
        required: false
        default: false
        type: boolean
      sleep_checks:
        description: Run isolated sleep UI and reconnect checks
        required: false
        default: false
        type: boolean
      preheat_checks:
        description: Run isolated studio preheat and UI evidence only
        required: false
        default: false
        type: boolean
      theme_palette_checks:
        description: Run only theme palette windows and state checks on a disposable cloud emulator
        required: false
        default: false
        type: boolean
      page_background_checks:
        description: Run theme palettes and page backgrounds together on a disposable cloud emulator
        required: false
        default: false
        type: boolean
      update_checks:
        description: 'Run fixed isolated update runtime and UI acceptance instead of lifecycle'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_CARD_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_card_checks == true && 'true' || 'false' }}
      AI_COPY_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_copy_checks == true && 'true' || 'false' }}
      CI_CARD_AVD: openhoyi-card-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_LIVE_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_live_checks == true && 'true' || 'false' }}
      DOWNLOAD_PROGRESS_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.download_progress_checks == true && 'true' || 'false' }}
      SLEEP_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.sleep_checks == true && 'true' || 'false' }}
      PREHEAT_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.preheat_checks == true && 'true' || 'false' }}
      THEME_PALETTE_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.theme_palette_checks == true && 'true' || 'false' }}
      PAGE_BACKGROUND_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.page_background_checks == true && 'true' || 'false' }}
      CI_BACKGROUND_AVD: openhoyi-background-${{ github.run_id }}-${{ github.run_attempt }}
      CI_THEME_AVD: openhoyi-theme-${{ github.run_id }}-${{ github.run_attempt }}
      UPDATE_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_checks == true && 'true' || 'false' }}
    steps:
      - name: Reject mixed isolated acceptance requests
        if: env.AI_CARD_CHECKS == 'true' || env.AI_COPY_CHECKS == 'true' || env.THEME_PALETTE_CHECKS == 'true' || env.PAGE_BACKGROUND_CHECKS == 'true'
        run: |
          if [ "$AI_CARD_CHECKS" = true ] || [ "$AI_COPY_CHECKS" = true ]; then
            test "$AI_CARD_CHECKS" != "$AI_COPY_CHECKS"
            test "$THEME_PALETTE_CHECKS" = false
          fi
          if [ "$PAGE_BACKGROUND_CHECKS" = true ]; then
            test "$AI_CARD_CHECKS" = false
            test "$AI_COPY_CHECKS" = false
            test "$THEME_PALETTE_CHECKS" = false
          fi
          test "$CLOUDFLARE_LIVE_CHECKS" = false
          test "$DOWNLOAD_PROGRESS_CHECKS" = false
          test "$SLEEP_CHECKS" = false
          test "$PREHEAT_CHECKS" = false
          test "$UPDATE_CHECKS" = false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock APK
        if: env.UPDATE_CHECKS != 'true'
        run: ./gradlew :mobile:assembleMock :mobile:assembleMockAndroidTest --no-daemon --console=plain
      - name: Build fixed isolated update acceptance
        if: env.UPDATE_CHECKS == 'true'
        run: |
          ./gradlew --no-daemon --console=plain -PhoyiUpdateChecks=true :mobile:assembleUpdateFixture :mobile:assembleUpdateFixtureAndroidTest
          python3 scripts/check_update_acceptance.py --sdk "$ANDROID_HOME" --verify-only
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify lifecycle with targeted logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          avd-name: ${{ env.PAGE_BACKGROUND_CHECKS == 'true' && env.CI_BACKGROUND_AVD || env.THEME_PALETTE_CHECKS == 'true' && env.CI_THEME_AVD || (env.AI_CARD_CHECKS == 'true' || env.AI_COPY_CHECKS == 'true') && env.CI_CARD_AVD || 'test' }}
          force-avd-creation: true
          emulator-port: 5554
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # The copy fixture keeps its 411dp phone width while quartering the host framebuffer pixels.
          pre-emulator-launch-script: >-
            if [ "$AI_COPY_CHECKS" = "true" ]; then
            config="$ANDROID_AVD_HOME/${CI_CARD_AVD}.avd/config.ini";
            test -s "$config" &&
            sed -i -E '/^(hw[.]lcd[.](width|height|density)|skin[.](name|path))[[:space:]]*=/d' "$config" &&
            printf '%s\n' 'hw.lcd.width=720' 'hw.lcd.height=1560' 'hw.lcd.density=280' 'skin.name=720x1560' 'skin.path=720x1560' >> "$config";
            fi
          script: >-
            if [ "$PAGE_BACKGROUND_CHECKS" = "true" ]; then python3 scripts/capture_wide_photo_review.py;
            elif [ "$THEME_PALETTE_CHECKS" = "true" ]; then python3 scripts/check_theme_palette_ui.py;
            elif [ "$AI_CARD_CHECKS" = "true" ]; then python3 scripts/check_ai_card_construction.py;
            elif [ "$AI_COPY_CHECKS" = "true" ]; then python3 scripts/check_ai_card_construction.py --message-copy;
            else bash scripts/check_mock_or_update_acceptance.sh; fi
      - name: Upload card construction and APK identity evidence
        if: always() && env.AI_CARD_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ai-card-construction-${{ github.sha }}
          path: build/ai-card-construction/
          if-no-files-found: warn
          retention-days: 7
      - name: Collect AI copy emulator host failure context
        if: failure() && env.AI_COPY_CHECKS == 'true'
        run: |
          mkdir -p build/ai-message-copy
          {
            free -m
            group=$(sed -n 's/^0:://p' /proc/self/cgroup)
            for control in memory.max memory.events; do
              for directory in /sys/fs/cgroup "/sys/fs/cgroup${group%/}"; do
                if [ -r "$directory/$control" ]; then
                  printf '\n%s\n' "$directory/$control"
                  cat "$directory/$control"
                fi
              done
            done
            printf '\nEmulator crash report metadata (if available):\n'
            for database in /tmp/android-*/emu-crash-*.db; do
              if [ -d "$database" ]; then
                find "$database" -maxdepth 2 -type f -printf '%TF %TT %s %p\n' | sort | tail -20
              fi
            done
            printf '\nRecent kernel OOM/emulator warnings (if accessible):\n'
            sudo -n dmesg --time-format iso --level=emerg,alert,crit,err,warn |
              grep -Ei 'out of memory|oom[-_ ]|killed process|segfault|qemu|kvm|emulat' | tail -100
          } > build/ai-message-copy/host-failure.txt 2>&1 || true
      - name: Upload AI message copy evidence
        if: always() && env.AI_COPY_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ai-message-copy-${{ github.sha }}
          path: build/ai-message-copy/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload lifecycle logs
        if: always() && env.UPDATE_CHECKS != 'true' && env.PREHEAT_CHECKS != 'true' && env.AI_CARD_CHECKS != 'true' && env.AI_COPY_CHECKS != 'true' && env.THEME_PALETTE_CHECKS != 'true' && env.PAGE_BACKGROUND_CHECKS != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mock-lifecycle
          path: build/mock-lifecycle/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload palette windows and APK identity evidence
        if: always() && env.THEME_PALETTE_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: theme-palette-ui-${{ github.sha }}
          path: build/theme-palette-ui/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload combined appearance windows and APK identity evidence
        if: always() && env.PAGE_BACKGROUND_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: page-background-ui-${{ github.sha }}
          path: build/page-background-ui/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload isolated update acceptance evidence
        if: always() && env.UPDATE_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: update-acceptance-api34
          path: build/update-acceptance/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload studio preheat evidence
        if: always() && env.PREHEAT_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: studio-preheat-${{ github.sha }}
          path: build/studio-preheat/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sleep connection evidence
        if: always() && env.SLEEP_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sleep-connection-${{ github.sha }}
          path: build/sleep-connection/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload download routing evidence
        if: always() && env.DOWNLOAD_PROGRESS_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: download-routing-${{ github.sha }}
          path: build/download-routing/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Cloudflare live evidence
        if: always() && env.CLOUDFLARE_LIVE_CHECKS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-live-${{ github.sha }}
          path: build/cloudflare-live/
          retention-days: 7
