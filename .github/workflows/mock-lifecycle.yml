name: Verify Mock lifecycle

on:
  push:
    branches: [feature/native-ble]
    paths:
      - '.github/workflows/mock-lifecycle.yml'
      - 'scripts/check_mock_lifecycle.sh'
      - 'mobile/src/main/kotlin/io/openhoyi/mobile/AppVisibility*.kt'
      - 'mobile/src/main/kotlin/io/openhoyi/mobile/MobileApplication.kt'
      - 'mobile/src/main/kotlin/io/openhoyi/mobile/ThemedActivity.kt'
      - 'mobile/src/main/kotlin/io/openhoyi/mobile/*BrewFeedback*.kt'
      - 'mobile/src/main/assets/brew-feedback/**'
      - 'mobile/src/androidTest/**'
      - 'mobile/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock APK
        run: ./gradlew :mobile:assembleMock :mobile:assembleMockAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify lifecycle with targeted logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check_mock_lifecycle.sh
      - name: Upload lifecycle logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mock-lifecycle
          path: build/mock-lifecycle/
          if-no-files-found: warn
          retention-days: 7
