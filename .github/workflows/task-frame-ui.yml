name: Verify task frame UI

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  task-frame:
    runs-on: ubuntu-latest
    # Existing frames/M1 plus 12 real M2 forms and IME/business states; internal evidence budgets stay unchanged.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [tablet-user-landscape]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock
        run: ./gradlew :mobile:assembleMock :mobile:assembleMockAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native task frames
        env:
          PRODUCT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/check_task_frame_ui.sh ${{ matrix.profile }}
            bash scripts/check_strict_native_samples.sh
            bash scripts/check_product_visual_migration.sh
            bash scripts/check_form_visual_migration.sh
      - name: Upload real window evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task-frame-${{ matrix.profile }}
          path: |
            build/task-frame-ui/
            build/task-first-evidence/strict-native-samples/
            build/task-first-evidence/product-visual-migration/
            build/task-first-evidence/form-visual-migration/
          if-no-files-found: warn
          retention-days: 7
