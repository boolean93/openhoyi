name: Verify task frame UI

on:
  workflow_dispatch:
    inputs:
      home_only:
        description: Capture only representative Home windows and app font sizes
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  task-frame:
    runs-on: ubuntu-latest
    # Existing frames/M1 plus 12 real M2 forms and IME/business states; internal evidence budgets stay unchanged.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: before
            source: e46e41da5e3a895af18d81bbbd3a49e3193c7d0d
          - profile: after
            source: fa17e28aee8ef6bc8b5cca9faff72c3f5b183c55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve identical capture harness
        run: cp scripts/capture_home_viewports_ci.py scripts/capture_home_comparison_ci.py "$RUNNER_TEMP/"
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Mock
        run: ./gradlew :mobile:assembleMock --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native task frames
        env:
          PRODUCT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HOME_VIEWPORT_ONLY: ${{ inputs.home_only }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 "$RUNNER_TEMP/capture_home_comparison_ci.py"
      - name: Upload real window evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task-frame-${{ matrix.profile }}
          path: |
            build/task-frame-ui/
            build/home-viewports/
            build/task-first-evidence/strict-native-samples/
            build/task-first-evidence/product-visual-migration/
            build/task-first-evidence/form-visual-migration/
          if-no-files-found: warn
          retention-days: 7
