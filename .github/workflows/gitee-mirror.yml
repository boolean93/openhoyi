name: Gitee release mirror

on:
  workflow_run:
    workflows: [Develop APK prerelease]
    branches: [develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      allow_first_manifest:
        description: 'Only after separately approved Gitee main-branch bootstrap'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openhoyi-gitee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # OFF until owner configures/reviews environment and explicitly enables variable.
    if: >-
      vars.GITEE_MIRROR_ENABLED == 'true' &&
      github.repository == 'boolean93/openhoyi' && github.ref == 'refs/heads/develop' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'develop' &&
        github.event.workflow_run.path == '.github/workflows/develop-apk.yml'))
    environment: gitee-mirror
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Never execute upstream workflow_run.head_sha or consume its artifacts.
          ref: refs/heads/develop
          persist-credentials: false
      - name: Offline mirror regression tests
        run: python3 -m unittest discover -s scripts -p 'test_gitee_mirror*.py'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'
      - name: Verify public GitHub bytes and publish verified mirror last
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_MIRROR_TOKEN: ${{ secrets.GITEE_MIRROR_TOKEN }}
          GITEE_MIRROR_ENABLED: ${{ vars.GITEE_MIRROR_ENABLED }}
          GITEE_ALLOW_FIRST_MANIFEST: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_first_manifest && 'true' || 'false' }}
          HOYI_RELEASE_CERT_SHA256: ${{ vars.HOYI_RELEASE_CERT_SHA256 }}
        run: >-
          python3 scripts/gitee_mirror_runner.py
          --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
